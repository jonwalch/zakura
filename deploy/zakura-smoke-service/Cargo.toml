[package]
name = "zakura-smoke-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Smoke-test application that embeds zakurad and registers a custom Zakura p2p service"

[dependencies]
zakura = { path = "../../crates/zakurad", default-features = false }
zakura-network = { path = "../../crates/zakura-network" }

color-eyre = "0.6.5"
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
